name: nexa
description: مرکز قرآن و حدیث — سامانه آموزش و پیگیری فعالیت‌های قرآنی
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  image_picker: ^1.0.7
  record: ^7.1.1
  audioplayers: ^6.0.0
  intl: ^0.19.0
  path_provider: ^2.1.6
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo/nexa_logo.png

# تنظیمات ساخت آیکون اپ (اندروید/iOS) از روی همین لوگو.
# اجرا: flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#002018"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
